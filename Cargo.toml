[package]
name = "subtitle-grabber-in-rust"
version = "0.2.0"
description = "Download YouTube subtitles from a modern Rust desktop GUI — subtitle-grabber by Meke"
authors = ["Meke", "TheVixcho"]
license = "MIT"
repository = "https://github.com/TheVixcho/subtitle-grabber-in-Rust"
edition = "2021"

[lib]
name = "subtitle_grabber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "fs", "io-util", "time"] }
dirs = "6"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
opener = "0.7"
